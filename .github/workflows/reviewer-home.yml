name: Reviewer homepage
on:
  pull_request:
    branches: [taxflow-demo-pages]
  push:
    branches: [taxflow-demo-pages]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.55.0-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright==1.55.0 openpyxl pdfplumber
      - name: Exercise homepage from repository checkout
        env:
          HOME_NETWORK_CHECKS: '1'
        run: |
          python -m http.server 8088 --bind 127.0.0.1 >/tmp/homepage-server.log 2>&1 &
          curl --retry 5 --retry-connrefused -fsS http://127.0.0.1:8088/docs/index.html -o /dev/null
          python qa/reviewer_home.py
      - name: Verify deployed bytes and exercise public URL
        if: github.event_name == 'push'
        env:
          HOME_NETWORK_CHECKS: '1'
          HOME_TEST_URL: https://anilkanth98488-beep.github.io/sovereign-open-initiative/docs/index.html
        run: |
          for attempt in $(seq 1 75); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$HOME_TEST_URL" -o /tmp/public-home && cmp -s docs/index.html /tmp/public-home; then
              code=$(curl -sSL -o /tmp/fresh-home -w '%{http_code}' "$HOME_TEST_URL?release=$GITHUB_SHA")
              if [ "$code" = 200 ] && cmp -s docs/index.html /tmp/fresh-home; then
                echo "Live HTTP $code; canonical and cache-busted responses match."
                sha256sum /tmp/fresh-home
                python qa/reviewer_home.py
                exit $?
              fi
            fi
            sleep 10
          done
          exit 1
